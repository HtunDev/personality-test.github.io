<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပင်ကိုယ်စရိုက်စစ်ဆေးရေးဘော့</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-8 transform transition-all duration-500 scale-100">

        <!-- Welcome Screen -->
        <div id="welcome-screen" class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-4">ပင်ကိုယ်စရိုက်ဘော့</h1>
            <p class="text-gray-600 mb-8">မင်္ဂလာပါ! သင့်ရဲ့ပင်ကိုယ်စရိုက်ကို ရှာဖွေပြီး သင့်အတွက် ဘယ်အလုပ်အကိုင်တွေ အသင့်တော်ဆုံးလဲဆိုတာ ရှာဖွေဖို့ ကျွန်တော်ကူညီပေးပါမယ်။ မေးခွန်း ၃၀ မေးပါမယ်။ စဖို့အဆင်သင့်ဖြစ်ပြီလား။</p>
            <button id="start-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
                စတင်စစ်ဆေးမည်
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="mb-6">
                <p id="progress-text" class="text-sm text-gray-500 text-right mb-2"></p>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300 ease-in-out" style="width: 0%;"></div>
                </div>
            </div>
            <div id="question-card" class="bg-gray-50 p-6 rounded-xl shadow-inner mb-6">
                <p id="question-text" class="text-2xl font-semibold text-gray-700 leading-snug"></p>
            </div>
            <div id="answer-buttons" class="space-y-4">
                <!-- Answer buttons will be dynamically inserted here -->
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">သင်၏ ပင်ကိုယ်စရိုက် အစီရင်ခံစာ</h2>
            <div class="bg-indigo-100 p-6 rounded-xl text-center mb-6">
                <h3 class="text-xl font-bold text-indigo-800 mb-2">သင်၏ ပင်ကိုယ်စရိုက် အမျိုးအစား:</h3>
                <p id="final-type" class="text-5xl font-extrabold text-indigo-600"></p>
            </div>
            <div id="personality-report" class="bg-gray-50 p-6 rounded-xl shadow-inner">
                <!-- Personality report content will be dynamically inserted here -->
            </div>
        </div>

    </div>

    <script>
        // Data structure for the questions
        const questions = [
            // Extraversion (E) vs. Introversion (I)
            { question: "ပင်ပန်းတဲ့တစ်ပတ်ပြီးနောက်၊ ဘာလုပ်ရတာ အင်အားပြန်ပြည့်သလိုခံစားရလဲ...", choices: [{ text: "သူငယ်ချင်းတွေနဲ့အတူတူ အပြင်သွားပြီး ပေါင်းသင်းဆက်ဆံတာ။", score: 'E' }, { text: "တစ်ယောက်တည်း အိမ်မှာအေးအေးဆေးဆေး အနားယူတာ။", score: 'I' }], category: 'EI' },
            { question: "ပါတီပွဲတစ်ခုမှာ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "လူအများကြီးနဲ့ ပေါင်းသင်းပြောဆိုလေ့ရှိတယ်။", score: 'E' }, { text: "ရင်းနှီးတဲ့လူအနည်းငယ်နဲ့ပဲ ကပ်ပြီး စကားပြောလေ့ရှိတယ်။", score: 'I' }], category: 'EI' },
            { question: "ပြဿနာတစ်ခုကြုံလာရင်၊ ကျွန်တော်က...", choices: [{ text: "အဖြေရှာဖို့ သူများတွေနဲ့ ဆွေးနွေးပြောဆိုတယ်။", score: 'E' }, { text: "တစ်ယောက်တည်း တိတ်တိတ်ဆိတ်ဆိတ် စဉ်းစားတယ်။", score: 'I' }], category: 'EI' },
            { question: "ကျွန်တော့်အတွက် စံပြစနေ၊တနင်္ဂနွေပိတ်ရက်က...", choices: [{ text: "သူများတွေနဲ့အတူ လုပ်စရာအစီအစဉ်တွေ အများကြီးရှိတာ။", score: 'E' }, { text: "ကိုယ်ပိုင်ဝါသနာတစ်ခုခုအတွက် အချိန်အများကြီးရတာ။", score: 'I' }], category: 'EI' },
            { question: "စကားပြောဆိုတဲ့အခါ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "စကားအများစုကို ပြောတာ။", score: 'E' }, { text: "အများစုကို နားထောင်တာ။", score: 'I' }], category: 'EI' },
            { question: "ပရောဂျက်အသစ်တစ်ခုစတဲ့အခါ၊ ကျွန်တော်က...", choices: [{ text: "အဖွဲ့လိုက် စဥ်းစားဉာဏ်စမ်းတယ်။", score: 'E' }, { text: "ကိုယ့်ဘာသာကိုယ် စီစဉ်တယ်။", score: 'I' }], category: 'EI' },
            { question: "ဘယ်လိုနေရာမျိုးမှာ အင်အားအရှိဆုံးလို့ ခံစားရလဲ...", choices: [{ text: "လူအများကြီးကြားမှာ။", score: 'E' }, { text: "တိတ်ဆိတ်တဲ့၊ တစ်ကိုယ်တည်းရှိတဲ့ပတ်ဝန်းကျင်မှာ။", score: 'I' }], category: 'EI' },
            { question: "ကျွန်တော်က ပိုပြီးသက်တောင့်သက်သာဖြစ်တာက...", choices: [{ text: "လူအာရုံစိုက်ခံရတဲ့နေရာမှာ။", score: 'E' }, { text: "နောက်ကွယ်မှာနေရတာ။", score: 'I' }], category: 'EI' },

            // Sensing (S) vs. Intuition (N)
            { question: "အသစ်တစ်ခုကို လေ့လာတဲ့အခါ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "အချက်အလက်နဲ့ လက်တွေ့အသုံးချမှုတွေကို အရင်လေ့လာတယ်။", score: 'S' }, { text: "အဓိပ္ပာယ်နဲ့ အခြေခံသီအိုရီတွေကို နားလည်အောင်ကြိုးစားတယ်။", score: 'N' }], category: 'SN' },
            { question: "ကျွန်တော်က ပိုပြီးစိတ်ဝင်စားတာက...", choices: [{ text: "အမှန်တကယ်ရှိပြီး အထိအတွေ့ရတဲ့အရာတွေ။", score: 'S' }, { text: "စိတ်ကူးယဥ်ဆန်ပြီး စိတ်ကူးနဲ့ဆိုင်တဲ့အရာတွေ။", score: 'N' }], category: 'SN' },
            { question: "အဖြစ်အပျက်တစ်ခုကို ဖော်ပြတဲ့အခါ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "အသေးစိတ်အချက်အလက်တွေနဲ့ အဖြစ်အပျက်အစဉ်လိုက်ကို အာရုံစိုက်တယ်။", score: 'S' }, { text: "ယေဘုယျအဓိပ္ပာယ်နဲ့ သက်ရောက်မှုတွေကို အာရုံစိုက်တယ်။", score: 'N' }], category: 'SN' },
            { question: "ကျွန်တော်က ပိုပြီးဖော်ပြလေ့ရှိတာက...", choices: [{ text: "လက်တွေ့ကျပြီး အခြေအနေမှန်ကိုသိတဲ့သူ။", score: 'S' }, { text: "စိတ်ကူးစိတ်သန်းကောင်းပြီး အမြင်ကျယ်တဲ့သူ။", score: 'N' }], category: 'SN' },
            { question: "ကျွန်တော်က ပိုပြီးယုံကြည်တာက...", choices: [{ text: "ကျွန်တော့်ရဲ့အတိတ်အတွေ့အကြုံတွေနဲ့ သာမန်ဉာဏ်ပညာ။", score: 'S' }, { text: "ကျွန်တော့်ရဲ့အလိုလိုသိစိတ် (ဒိဋ္ဌ)ဉာဏ်။", score: 'N' }], category: 'SN' },
            { question: "စာအုပ်တစ်အုပ်ဖတ်တဲ့အခါ၊ ကျွန်တော်ကို ပိုဆွဲဆောင်တာက...", choices: [{ text: "နေရာနဲ့ဇာတ်ကောင်တွေရဲ့အသေးစိတ်ဖော်ပြချက်တွေ။", score: 'S' }, { text: "ပိုနက်ရှိုင်းတဲ့ သင်္ကေတနဲ့ အကြောင်းအရာတွေ။", score: 'N' }], category: 'SN' },
            { question: "ကျွန်တော်က ပိုပြီးဆွဲဆောင်ခံရတာက...", choices: [{ text: "တိကျပြီးစစ်မှန်တဲ့အချက်အလက်တွေ။", score: 'S' }, { text: "စိတ်ကူးယဥ်ဆန်တဲ့၊ ဖန်တီးမှုရှိတဲ့စိတ်ကူးတွေ။", score: 'N' }], category: 'SN' },
            { question: "ကျွန်တော်က ဘယ်အရာကို ပိုပြီးမှတ်မိနိုင်လဲ...", choices: [{ text: "တိကျတဲ့နာမည်တွေနဲ့ ရက်စွဲတွေ။", score: 'S' }, { text: "ပုံစံတွေနဲ့ အရာတွေကြားကဆက်နွယ်မှုတွေ။", score: 'N' }], category: 'SN' },

            // Thinking (T) vs. Feeling (F)
            { question: "ဆုံးဖြတ်ချက်ချတဲ့အခါ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "ယုတ္တိကျတဲ့အကြောင်းပြချက်နဲ့ လက်တွေ့ကျတဲ့အချက်တွေကို ဦးစားပေးတယ်။", score: 'T' }, { text: "ပါဝင်တဲ့လူတွေရဲ့ခံစားချက်နဲ့ ကိုယ်ပိုင်တန်ဖိုးတွေကို ဦးစားပေးတယ်။", score: 'F' }], category: 'TF' },
            { question: "ကျွန်တော်က ပိုပြီးဘယ်လိုအမြင်ခံရလဲ...", choices: [{ text: "ပွင့်လင်းပြီး တရားမျှတသူ။", score: 'T' }, { text: "သနားကြင်နာပြီး ကိုယ်ချင်းစာတရားရှိသူ။", score: 'F' }], category: 'TF' },
            { question: "အကြံဉာဏ်ပေးတဲ့အခါ၊ ကျွန်တော်က...", choices: [{ text: "တိုးတက်စေဖို့ ပွင့်ပွင့်လင်းလင်းနဲ့ ဝေဖန်လေ့ရှိတယ်။", score: 'T' }, { text: "ခံစားချက်ကိုမထိခိုက်အောင် သိမ်မွေ့ပြီး အားပေးတတ်တယ်။", score: 'F' }], category: 'TF' },
            { question: "ကျွန်တော်က ဘယ်အရာကို ပိုလွယ်ကူတယ်လို့ခံစားရလဲ...", choices: [{ text: "ပြဿနာတွေကို ဘက်မလိုက်ဘဲခွဲခြမ်းစိတ်ဖြာတာ။", score: 'T' }, { text: "လူတွေရဲ့စိတ်ခံစားချက်ကို နားလည်တာ။", score: 'F' }], category: 'TF' },
            { question: "ငြင်းခုန်တဲ့အခါ၊ ကျွန်တော်က ပိုပြီးအာရုံစိုက်တာက...", choices: [{ text: "ပြဿနာရဲ့အခြေခံမူတွေနဲ့ ယုတ္တိ။", score: 'T' }, { text: "လူတွေဘယ်လိုခံစားနေရသလဲနဲ့ အဖွဲ့ရဲ့သဟဇာတဖြစ်မှု။", score: 'F' }], category: 'TF' },
            { question: "ကျွန်တော်က ဘယ်အရာအပေါ်မူတည်ပြီး ဆုံးဖြတ်ချက်ချဖို့ ပိုပြီးသက်တောင့်သက်သာဖြစ်လဲ...", choices: [{ text: "အချက်အလက်တွေနဲ့ အထောက်အထားတွေ။", score: 'T' }, { text: "ကျွန်တော့်ကိုယ်ပိုင်ယုံကြည်ချက်နဲ့ မှန်တယ်လို့ခံစားရတဲ့အရာ။", score: 'F' }], category: 'TF' },
            { question: "ကျွန်တော်က ပိုပြီးဘယ်လိုဖော်ပြခံရလဲ...", choices: [{ text: "ဆင်ခြင်တုံတရားရှိပြီး ခိုင်မာသူ။", score: 'T' }, { text: "နွေးထွေးပြီးကြင်နာတတ်သူ။", score: 'F' }], category: 'TF' },
            { question: "ကျွန်တော်က ဘယ်အရာက ပိုပြီးစည်းရုံးနိုင်တယ်လို့ခံစားရလဲ...", choices: [{ text: "ခိုင်မာတဲ့၊ ယုတ္တိကျတဲ့အကြောင်းပြချက်။", score: 'T' }, { text: "စိတ်လှုပ်ရှားဖွယ်ရာကောင်းတဲ့၊ စိတ်ရင်းခံနဲ့ပြောပြတဲ့ဇာတ်လမ်း။", score: 'F' }], category: 'TF' },

            // Judging (J) vs. Perceiving (P)
            { question: "ကျွန်တော့်အလုပ်လုပ်တဲ့နေရာက များသောအားဖြင့်...", choices: [{ text: "သပ်ရပ်ပြီး စနစ်တကျရှိတယ်။", score: 'J' }, { text: "နည်းနည်းရှုပ်ပွပေမယ့် စိတ်ကူးဉာဏ်ရဖို့အနီးအနားမှာအကုန်ထားတယ်။", score: 'P' }], category: 'JP' },
            { question: "ခရီးသွားဖို့စီစဉ်တဲ့အခါ၊ ကျွန်တော်က ပိုပြီး...", choices: [{ text: "အသေးစိတ်အစီအစဥ်ရေးပြီး လိုက်နာတယ်။", score: 'J' }, { text: "အလိုလိုနေရင်းဖြစ်ပေါ်လာမယ့်အရာတွေကို ခွင့်ပြုဖို့ အချိန်ဇယားကိုပြောင်းလွယ်ပြင်လွယ်လုပ်ထားတယ်။", score: 'P' }], category: 'JP' },
            { question: "ဘယ်လိုဘဝမျိုးမှာ ပိုပြီးသက်တောင့်သက်သာဖြစ်လဲ...", choices: [{ text: "စည်းစနစ်ကျပြီး ခန့်မှန်းရလွယ်ကူတဲ့ဘဝ။", score: 'J' }, { text: "အလိုလိုနေရင်းဖြစ်ပေါ်လာပြီး အပြောင်းအလဲကိုလက်ခံတဲ့ဘဝ။", score: 'P' }], category: 'JP' },

            },
            'ENFP': {
                description: "စံပြ (Champion)။ ENFP တစ်ယောက်အနေနဲ့ သင်ဟာ စွမ်းအင်အပြည့်နဲ့၊ စိတ်အားထက်သန်ပြီး၊ အလွန်ဖန်တီးနိုင်စွမ်းရှိတဲ့ လွတ်လပ်တဲ့စိတ်ဓာတ်ရှိသူဖြစ်တယ်။ သင်ဟာ စိတ်ကူးအသစ်တွေနဲ့ ဖြစ်နိုင်ခြေတွေကို စူးစမ်းလေ့လာရတာကိုနှစ်သက်ပါတယ်။ သင့်ရဲ့စိတ်အားထက်သန်မှုနဲ့ လူအများနဲ့ပေါင်းသင်းဆက်ဆံရေးကောင်းမွန်မှုက သင့်ကို သဘာဝအတိုင်းလူတွေနဲ့ချိတ်ဆက်ပေးနိုင်သူဖြစ်စေပြီး သူများအတွက်လည်း စိတ်အားထက်သန်မှုရရှိစေပါတယ်။ သင်ဟာ သင့်ရဲ့ဖန်တီးနိုင်စွမ်းကို ဖော်ပြနိုင်တဲ့ တက်ကြွတဲ့ပတ်ဝန်းကျင်မှာ ကြီးထွားတတ်တယ်။",
                careers: ["သတင်းစာဆရာ (Journalist)", "စျေးကွက်ရှာဖွေရေးအတိုင်ပင်ခံ (Marketing Consultant)", "စိတ်ပညာရှင် (Psychologist)", "ဆရာ/မ (Teacher)", "အနုပညာဒါရိုက်တာ (Art Director)", "စီးပွားရေးစွန့်ဦးတီထွင်သူ (Entrepreneur)"]

                careers: ["ကွန်ပျူတာသိပ္ပံပညာရှင် (Computer Scientist)", "ဗိသုကာပညာရှင် (Architect)", "သိပ္ပံပညာရှင် (Scientist)", "ဘဏ္ဍာရေးအကြံပေး (Financial Planner)", "ဗျူဟာပညာရှင် (Strategist)", "တက္ကသိုလ်ပါမောက္ခ (University Professor)"]
            },
            'ISFJ': {
                description: "ကာကွယ်သူ (Defender)။ ISFJ တစ်ယောက်အနေနဲ့ သင်ဟာ နွေးထွေးမှု၊ သတိရှိမှုနဲ့ သူများကိုကူညီဖို့ စိတ်အားထက်သန်မှုတို့အတွက် လူသိများပါတယ်။ သင်ဟာ တိတ်ဆိတ်ပြီး ကြင်နာတတ်သူဖြစ်ပြီး အဖွဲ့တစ်ခု ဒါမှမဟုတ် မိသားစုတစ်ခုရဲ့ကျောရိုးဖြစ်လေ့ရှိတယ်။ သင်ဟာ အသေးစိတ်အချက်အလက်တွေကို အလွန်မှတ်မိပြီး၊ ဒါဟာ သူများကို လက်တွေ့ကျကျကူညီဖို့ အထောက်အကူဖြစ်စေပါတယ်။ သင်ဟာ လူတွေကို ဂရုစိုက်ဖို့နဲ့ ကာကွယ်ဖို့ခွင့်ပြုတဲ့ အခန်းကဏ္ဍတွေမှာ ကြီးထွားတတ်တယ်။",
                careers: ["သူနာပြု (Nurse)", "လူမှုရေးလုပ်သား (Social Worker)", "စာကြည့်တိုက်မှူး (Librarian)", "မူလတန်းကျောင်းဆရာ/မ (Elementary School Teacher)", "ဖောက်သည်ဝန်ဆောင်မှုကိုယ်စားလှယ် (Customer Service Representative)", "กายภาพบำบัด (Physical Therapist)"]
            },
            // Fallback for any other type
            'default': {
                description: "သင်ရဲ့ ထူးခြားတဲ့ပင်ကိုယ်စရိုက်ပုံစံက သင်ဟာ ဘက်စုံတော်တဲ့သူတစ်ယောက်ဖြစ်တယ်ဆိုတာ ပြသနေပါတယ်။ သင့်မှာ မတူညီတဲ့ ပတ်ဝန်းကျင်အမျိုးမျိုးမှာ ထိရောက်မှုရှိစေတဲ့ ပင်ကိုယ်စရိုက်တွေ ထူးထူးခြားခြားပေါင်းစပ်နေပါတယ်။ သင့်ရဲ့စိတ်အားထက်သန်မှုနဲ့ တကယ်ကိုကိုက်ညီတဲ့အရာကို ရှာဖွေဖို့ နယ်ပယ်အမျိုးမျိုးကို စူးစမ်းလေ့လာဖို့ ကျွန်တော်အကြံပြုလိုပါတယ်။",
                careers: ["ပရောဂျက်မန်နေဂျာ (Project Manager)", "အတိုင်ပင်ခံ (Consultant)", "အထွေထွေမန်နေဂျာ (General Manager)", "အရောင်းကိုယ်စားလှယ် (Sales Representative)", "ပြည်သူ့ဆက်ဆံရေးအထူးကု (Public Relations Specialist)", "စီးပွားရေးလေ့လာသုံးသပ်သူ (Business Analyst)"]
            }
        };

        // UI elements
        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startButton = document.getElementById('start-button');
        const questionText = document.getElementById('question-text');
        const answerButtonsContainer = document.getElementById('answer-buttons');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const finalTypeElement = document.getElementById('final-type');
        const personalityReportElement = document.getElementById('personality-report');

        // State variables
        let currentQuestionIndex = 0;
        const scores = { 'E': 0, 'I': 0, 'S': 0, 'N': 0, 'T': 0, 'F': 0, 'J': 0, 'P': 0 };

        // Event listener for the start button
        startButton.addEventListener('click', startQuiz);

        // Function to start the quiz
        function startQuiz() {
            welcomeScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayQuestion();
        }

        // Function to display the current question
        function displayQuestion() {
            if (currentQuestionIndex < questions.length) {
                const currentQuestion = questions[currentQuestionIndex];
                questionText.textContent = currentQuestion.question;
                
                answerButtonsContainer.innerHTML = '';
                currentQuestion.choices.forEach(choice => {
                    const button = document.createElement('button');
                    button.textContent = choice.text;
                    button.classList.add('w-full', 'py-4', 'px-6', 'rounded-xl', 'text-gray-700', 'bg-white', 'border', 'border-gray-200', 'hover:bg-indigo-50', 'hover:border-indigo-300', 'transition-colors', 'duration-300', 'shadow-md', 'hover:shadow-lg', 'focus:outline-none', 'focus:ring-4', 'focus:ring-indigo-500', 'focus:ring-opacity-50');
                    button.addEventListener('click', () => handleAnswer(choice.score));
                    answerButtonsContainer.appendChild(button);
                });

                // Update progress bar
                const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `မေးခွန်း ${currentQuestionIndex + 1} / ${questions.length}`;
            } else {
                showResults();
            }
        }

        // Function to handle an answer click
        function handleAnswer(score) {
            scores[score]++;
            currentQuestionIndex++;
            displayQuestion();
        }

        // Function to show the final results
        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            const finalType = determinePersonalityType();
            const report = reports[finalType] || reports['default'];

            finalTypeElement.textContent = finalType;
            personalityReportElement.innerHTML = `
                <h3 class="text-xl font-bold text-gray-800 mb-4">ဖော်ပြချက်</h3>
                <p class="text-gray-600 leading-relaxed mb-6">${report.description}</p>
                
                <h3 class="text-xl font-bold text-gray-800 mb-4">သင့်အတွက် အသင့်တော်ဆုံး အလုပ်အကိုင်များ</h3>
                <ul class="list-disc list-inside space-y-2 text-gray-600">
                    ${report.careers.map(career => `<li class="font-medium">${career}</li>`).join('')}
                </ul>
            `;
        }

        // Function to determine the final MBTI type
        function determinePersonalityType() {
            let finalType = "";
            finalType += scores['E'] > scores['I'] ? 'E' : 'I';
            finalType += scores['S'] > scores['N'] ? 'S' : 'N';
            finalType += scores['T'] > scores['F'] ? 'T' : 'F';
            finalType += scores['J'] > scores['P'] ? 'J' : 'P';
            return finalType;
        }

    </script>
